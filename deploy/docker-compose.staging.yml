services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}:${IMAGE_TAG:-staging}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PIPELINE_API_KEY: ${PIPELINE_API_KEY:?PIPELINE_API_KEY is required}
    ports:
      - "${WEB_HTTP_PORT:-8080}:80"

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}:${IMAGE_TAG:-staging}
    restart: unless-stopped
    env_file:
      - ./env/backend.staging.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka:
    image: bitnami/kafka:3.7
    profiles: ["events"]
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-topics-init:
    image: bitnami/kafka:3.7
    profiles: ["events"]
    command:
      - /bin/bash
      - -lc
      - |
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tt.issues --partitions 1 --replication-factor 1 --config retention.ms=604800000
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tt.comments --partitions 1 --replication-factor 1 --config retention.ms=604800000
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tt.releases --partitions 1 --replication-factor 1 --config retention.ms=604800000
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tt.workflow --partitions 1 --replication-factor 1 --config retention.ms=604800000
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tt.notifications.dlq --partitions 1 --replication-factor 1 --config retention.ms=2592000000
    depends_on:
      kafka:
        condition: service_healthy

  backend-relay:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}:${IMAGE_TAG:-staging}
    command: ["npm", "run", "events:relay"]
    profiles: ["events"]
    restart: unless-stopped
    env_file:
      - ./env/backend.staging.env
    environment:
      NOTIFICATIONS_ENABLED: "true"
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: tasktime-backend-relay
    depends_on:
      postgres:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasktime_staging}
      POSTGRES_USER: ${POSTGRES_USER:-tasktime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasktime} -d ${POSTGRES_DB:-tasktime_staging}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pipeline-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PIPELINE_POSTGRES_DB:-pipeline}
      POSTGRES_USER: ${PIPELINE_POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${PIPELINE_POSTGRES_PASSWORD:?PIPELINE_POSTGRES_PASSWORD is required}
    volumes:
      - pipeline-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PIPELINE_POSTGRES_USER:-pipeline} -d ${PIPELINE_POSTGRES_DB:-pipeline}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pipeline-service:
    image: ${PIPELINE_IMAGE:?PIPELINE_IMAGE is required}:${IMAGE_TAG:-staging}
    restart: unless-stopped
    env_file:
      - ./env/pipeline.staging.env
    depends_on:
      pipeline-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3100/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No external port — accessible only via nginx /pipeline/ proxy

  mcp:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}:${IMAGE_TAG:-staging}
    command: ["node", "dist/mcp/server.js"]
    restart: unless-stopped
    env_file:
      - ./env/backend.staging.env
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: "3002"
      BACKEND_INTERNAL_URL: http://backend:3000
      MCP_AGENT_EMAIL: agent@flow-universe.internal
    ports:
      - "3002:3002"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
  pipeline-postgres-data:
  kafka-data:
