services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasktime
      POSTGRES_PASSWORD: tasktime
      POSTGRES_DB: tasktime
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasktime"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    # CVE-07: In production, use 'command' with --requirepass and remove port binding
    # command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    profiles: ["events"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-topics-init:
    image: bitnami/kafka:3.7
    profiles: ["events"]
    command:
      - /bin/bash
      - -lc
      - |
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tt.issues --partitions 1 --replication-factor 1 --config retention.ms=604800000
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tt.comments --partitions 1 --replication-factor 1 --config retention.ms=604800000
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tt.releases --partitions 1 --replication-factor 1 --config retention.ms=604800000
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tt.workflow --partitions 1 --replication-factor 1 --config retention.ms=604800000
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tt.notifications.dlq --partitions 1 --replication-factor 1 --config retention.ms=2592000000
    depends_on:
      kafka:
        condition: service_healthy

  backend-relay:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["events"]
    command: ["npm", "run", "events:relay"]
    environment:
      DATABASE_URL: postgresql://tasktime:${POSTGRES_PASSWORD:-tasktime}@postgres:5432/tasktime?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      NOTIFICATIONS_ENABLED: "true"
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: tasktime-backend-relay
    depends_on:
      postgres:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Pipeline Service DB ---
  pipeline-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: pipeline
    ports:
      - "5433:5432"
    volumes:
      - pipeline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MCP HTTP-сервер Flow Universe (нативный, прямой доступ к БД)
  # Запуск: MCP_SERVICE_TOKEN=<token> MCP_AGENT_PASSWORD=<pwd> docker compose --profile mcp up -d mcp-flow-universe
  # .mcp.json коллеги: { "type": "streamable-http", "url": "http://<host>:3002/mcp",
  #                      "headers": { "Authorization": "Bearer <token>" } }
  mcp-flow-universe:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["mcp"]
    command: ["node", "dist/mcp/server.js"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: "3002"
      MCP_ENV: ${MCP_ENV:-production}
      DATABASE_URL: postgresql://tasktime:${POSTGRES_PASSWORD:-tasktime}@postgres:5432/tasktime?schema=public
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:?MCP_SERVICE_TOKEN is required}
      # Write operations route through the backend API (workflow engine + RBAC).
      # BACKEND_INTERNAL_URL must point to the running backend:
      #   - on the same host: http://localhost:3000 (default)
      #   - in a Docker network with a backend service: http://backend:3000
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://localhost:3000}
      MCP_AGENT_EMAIL: ${MCP_AGENT_EMAIL:-agent@flow-universe.internal}
      MCP_AGENT_PASSWORD: ${MCP_AGENT_PASSWORD:?MCP_AGENT_PASSWORD is required for write operations}
    ports:
      - "3002:3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  pipeline-pgdata:
  kafka-data:
